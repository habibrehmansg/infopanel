name: CodeQL

# Code scanning for the 2.0 line only: this file lives on 2.0.x, and its triggers name 2.0.x, so 1.4.x is never scanned.
# A scheduled run would only fire from the default branch (1.4.x), so scans run on each push and pull request instead.
on:
  push:
    branches: [2.0.x]
  pull_request:
    branches: [2.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
