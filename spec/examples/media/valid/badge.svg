<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <title>Badge</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="shine" href="#face" cx="0.5" cy="0.3" r="0.6"/>
    <clipPath id="round">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
    <symbol id="tick" viewBox="0 0 4 10">
      <rect width="4" height="10" rx="2" fill="#ffffff"/>
    </symbol>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#face)"/>
    <circle cx="32" cy="20" r="24" fill="url(#shine)" opacity="0.4"/>
  </g>
  <use href="#tick" x="30" y="6" width="4" height="10"/>
  <use xlink:href="#tick" x="30" y="6" width="4" height="10" transform="rotate(60 32 32)"/>
  <path d="M32 32 L46 40" style="stroke: #fdd835; stroke-width: 4; stroke-linecap: round; fill: none"/>
</svg>
